<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora de Edad - Star Wars</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>Calculadora de Edad en Star Wars</h1>
      <p>
        Ingresa tu edad y elige una especie para conocer tu edad en su esperanza
        de vida.
      </p>

      <label for="age">Tu edad:</label>
      <input type="number" id="age" min="0" placeholder="Ej. 25" />

      <label for="species">Selecciona una especie:</label>
      <select id="species">
        <option value="80">Humano</option>
        <option value="400">Wookiee</option>
        <option value="900">Especie de Yoda</option>
        <option value="85">Twi’lek</option>
        <option value="60">Ewok</option>
      </select>

      <button onclick="calculateStarWarsAge()">Calcular Edad</button>

      <p id="result"></p>

      <img src="rebels.png" alt="Star Wars Logo" class="logo" />
    </div>

    <script src="script.js"></script>
  </body>
</html>
